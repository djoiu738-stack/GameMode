name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project
        run: |
          mkdir -p GameMode && cd GameMode
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GameMode"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.gamemode"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.gamemode"
                  minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
              <queries>
                  <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
              </queries>
              <application android:label="وضع الألعاب" android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/example/gamemode
          cat > app/src/main/java/com/example/gamemode/MainActivity.kt <<'EOF_FILE'
          package com.example.gamemode
          
          import android.app.Activity
          import android.app.NotificationManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          
          class MainActivity : Activity() {
              private lateinit var prefs: SharedPreferences
              private lateinit var btn: TextView
              private lateinit var status: TextView
              private lateinit var spinner: Spinner
              private var apps = listOf<Pair<String, String>>()
              private val red = Color.parseColor("#FF1E2D")
          
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_LONG).show()
          
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  prefs = getSharedPreferences("gm", Context.MODE_PRIVATE)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setBackgroundColor(Color.parseColor("#0A0A0C"))
                      setPadding(dp(24), dp(48), dp(24), dp(24))
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }
                  root.addView(TextView(this).apply {
                      text = "وضع الألعاب"; textSize = 26f; setTextColor(Color.WHITE)
                      setTypeface(null, Typeface.BOLD)
                  })
                  status = TextView(this).apply { textSize = 14f; setTextColor(Color.GRAY) }
                  root.addView(status)
          
                  btn = TextView(this).apply {
                      gravity = Gravity.CENTER; textSize = 24f; setTypeface(null, Typeface.BOLD)
                      setOnClickListener { if (prefs.getBoolean("on", false)) disable() else enable() }
                  }
                  root.addView(btn, LinearLayout.LayoutParams(dp(220), dp(220)).apply {
                      topMargin = dp(48); bottomMargin = dp(48)
                  })
          
                  root.addView(TextView(this).apply {
                      text = "اللعبة التي تُفتح تلقائيًا"; setTextColor(Color.GRAY)
                  })
                  val pm = packageManager
                  val list = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                  ).map { it.loadLabel(pm).toString() to it.activityInfo.packageName }
                      .filter { it.second != packageName }.sortedBy { it.first }
                  apps = listOf("بدون لعبة" to "") + list
                  spinner = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, apps.map { it.first })
                      setSelection(apps.indexOfFirst { it.second == prefs.getString("game", "") }.coerceAtLeast(0))
                  }
                  root.addView(spinner, LinearLayout.LayoutParams(-1, -2))
          
                  root.addView(TextView(this).apply {
                      text = "عند التشغيل: يُفعَّل عدم الإزعاج، ويُرفع السطوع للأقصى، ويهتز الهاتف، وتُفتح اللعبة. عند الإيقاف يعود كل شيء كما كان."
                      setTextColor(Color.GRAY); textSize = 12f; setPadding(0, dp(24), 0, 0)
                  })
                  setContentView(root)
                  render(prefs.getBoolean("on", false))
              }
          
              private fun render(on: Boolean) {
                  btn.text = if (on) "يعمل" else "تشغيل"
                  btn.setTextColor(if (on) red else Color.LTGRAY)
                  btn.background = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(if (on) Color.parseColor("#33FF1E2D") else Color.parseColor("#17171B"))
                      setStroke(dp(4), if (on) red else Color.parseColor("#2A2A31"))
                  }
                  status.text = if (on) "وضع الألعاب مفعّل" else "وضع الألعاب متوقف"
              }
          
              private fun buzz(pattern: LongArray) {
                  getSystemService(Vibrator::class.java)
                      .vibrate(VibrationEffect.createWaveform(pattern, -1))
              }
          
              private fun enable() {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (!nm.isNotificationPolicyAccessGranted) {
                      toast("فعّل الصلاحية لتطبيق وضع الألعاب ثم ارجع")
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS)); return
                  }
                  if (!Settings.System.canWrite(this)) {
                      toast("فعّل «تعديل إعدادات النظام» ثم ارجع")
                      startActivity(Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:$packageName"))); return
                  }
                  val cr = contentResolver
                  val game = apps[spinner.selectedItemPosition].second
                  prefs.edit()
                      .putInt("filter", nm.currentInterruptionFilter)
                      .putInt("bright", Settings.System.getInt(cr, Settings.System.SCREEN_BRIGHTNESS, 128))
                      .putInt("mode", Settings.System.getInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, 1))
                      .putString("game", game).putBoolean("on", true).apply()
                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_NONE)
                  Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS_MODE, 0)
                  Settings.System.putInt(cr, Settings.System.SCREEN_BRIGHTNESS, 255)
                  buzz(longArrayOf(0, 40, 30, 80)); render(true)
                  if (game.isNotEmpty()) packageManager.getLaunchIntentForPackage(game)?.let { startActivity(it) }
              }
          
              private fun disable() {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (nm.isNotificationPolicyAccessGranted)
                      nm.setInterruptionFilter(prefs.getInt("filter", NotificationManager.INTERRUPTION_FILTER_ALL))
                  if (Settings.System.canWrite(this)) {
                      Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, prefs.getInt("bright", 128))
                      Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, prefs.getInt("mode", 1))
                  }
                  prefs.edit().putBoolean("on", false).apply()
                  buzz(longArrayOf(0, 30)); render(false)
              }
          }
          EOF_FILE
      - name: Build
        working-directory: GameMode
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GameMode-APK
          path: GameMode/app/build/outputs/apk/debug/app-debug.apk
